[package]
name = "tree-sitter-remora"
description = "Tree-sitter grammar for Remora programming language"
version = "0.1.0"
authors = ["Greg Sullivan <gsullivan@draper.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "remora"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/remora-lang/remora/tree/main/utils/tree-sitter-remora"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
